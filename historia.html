<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado · História · VUNESP · Nível Fundamental</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --paper2: #ede7d9;
    --gold: #b8860b;
    --gold-light: #d4a820;
    --red: #8b1a1a;
    --green: #1a5c2e;
    --blue-dark: #1a2a4a;
    --border: #c8b89a;
    --shadow: rgba(26,18,8,0.15);
    --correct: #1a5c2e;
    --wrong: #8b1a1a;
    --neutral: #3a2e1a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(184,134,11,0.07) 27px, rgba(184,134,11,0.07) 28px);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ─────────────────────────────────── */
  /* Adicione junto ao CSS do Header */
  .btn-voltar {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    color: var(--gold-light);
    text-decoration: none;
    font-family: 'Source Serif 4', serif;
    font-size: 0.85rem;
    font-weight: 600;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .btn-voltar:hover {
    opacity: 0.7;
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    .btn-voltar {
      position: relative;
      display: inline-block;
      top: 0;
      left: 0;
      margin-bottom: 1.5rem;
    }
  }
  header {
    background: var(--blue-dark);
    color: var(--paper);
    text-align: center;
    padding: 2.4rem 1.5rem 2rem;
    border-bottom: 4px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent, transparent 14px,
      rgba(184,134,11,0.08) 14px, rgba(184,134,11,0.08) 15px
    );
  }
  .header-badge {
    display: inline-block;
    border: 1.5px solid var(--gold);
    color: var(--gold-light);
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    padding: .3rem .9rem;
    margin-bottom: .9rem;
    position: relative;
  }
  header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.7rem, 4vw, 2.6rem);
    font-weight: 900;
    letter-spacing: -.01em;
    line-height: 1.15;
    position: relative;
  }
  header p {
    margin-top: .55rem;
    font-size: .92rem;
    opacity: .8;
    font-style: italic;
    position: relative;
  }

  /* ── PROGRESS BAR ────────────────────────────── */
  .progress-wrap {
    background: var(--paper2);
    border-bottom: 1px solid var(--border);
    padding: .85rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .progress-track {
    flex: 1;
    height: 7px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 4px;
    transition: width .5s ease;
    width: 0%;
  }
  .progress-label {
    font-size: .82rem;
    color: var(--neutral);
    white-space: nowrap;
    font-weight: 600;
  }
  .score-badge {
    font-size: .8rem;
    background: var(--blue-dark);
    color: var(--gold-light);
    padding: .25rem .75rem;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── MAIN LAYOUT ─────────────────────────────── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* ── QUESTION CARD ───────────────────────────── */
  .question-card {
    background: #fff;
    border: 1px solid var(--border);
    border-top: 4px solid var(--gold);
    border-radius: 2px;
    padding: 2rem 2.2rem 1.8rem;
    margin-bottom: 2.5rem;
    box-shadow: 4px 4px 0 rgba(184,134,11,0.12), 0 2px 16px var(--shadow);
    animation: slideIn .45s ease both;
    display: none;
    position: relative;
  }
  .question-card.active { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: 'Playfair Display', serif;
    font-size: .78rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: .5rem;
  }

  .q-tag {
    display: inline-block;
    background: var(--blue-dark);
    color: var(--paper);
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: .18rem .65rem;
    border-radius: 2px;
    margin-bottom: 1rem;
    vertical-align: middle;
  }

  .q-stimulus {
    background: var(--paper2);
    border-left: 3px solid var(--gold);
    border-radius: 0 2px 2px 0;
    padding: .85rem 1.1rem;
    margin-bottom: 1.2rem;
    font-style: italic;
    font-size: .91rem;
    line-height: 1.65;
    color: #3a2e1a;
  }
  .q-stimulus cite {
    display: block;
    margin-top: .5rem;
    font-size: .78rem;
    color: var(--gold);
    font-style: normal;
    font-weight: 600;
  }

  .q-enunciado {
    font-size: 1rem;
    line-height: 1.7;
    margin-bottom: 1.4rem;
    font-weight: 600;
  }

  /* ── ALTERNATIVES ────────────────────────────── */
  .alternatives { list-style: none; }
  .alternatives li {
    margin-bottom: .6rem;
  }
  .alt-btn {
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: .85rem;
    padding: .8rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    background: var(--paper);
    cursor: pointer;
    text-align: left;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: .93rem;
    line-height: 1.55;
    color: var(--ink);
    transition: border-color .18s, background .18s, transform .12s;
  }
  .alt-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: #fffdf5;
    transform: translateX(3px);
  }
  .alt-letter {
    min-width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: .8rem;
    color: var(--gold);
    flex-shrink: 0;
    margin-top: .05rem;
    transition: background .18s, color .18s, border-color .18s;
  }

  /* answered states */
  .alt-btn.correct {
    border-color: var(--correct);
    background: #f0faf4;
  }
  .alt-btn.correct .alt-letter {
    background: var(--correct);
    color: #fff;
    border-color: var(--correct);
  }
  .alt-btn.wrong {
    border-color: var(--wrong);
    background: #fdf3f3;
    opacity: .85;
  }
  .alt-btn.wrong .alt-letter {
    background: var(--wrong);
    color: #fff;
    border-color: var(--wrong);
  }
  .alt-btn:disabled { cursor: default; }

  /* ── FEEDBACK / COMMENTARY ───────────────────── */
  .feedback {
    margin-top: 1.4rem;
    padding: 1.2rem 1.3rem;
    border-radius: 2px;
    font-size: .91rem;
    line-height: 1.7;
    display: none;
    animation: fadeIn .35s ease;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: #f0faf4;
    border: 1px solid #7bbf96;
    border-left: 4px solid var(--correct);
  }
  .feedback.wrong-fb {
    background: #fdf3f3;
    border: 1px solid #d48888;
    border-left: 4px solid var(--wrong);
  }
  .feedback-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: .5rem;
  }
  .feedback.correct-fb .feedback-title { color: var(--correct); }
  .feedback.wrong-fb .feedback-title { color: var(--wrong); }
  .gabarito-tag {
    display: inline-block;
    background: var(--blue-dark);
    color: var(--gold-light);
    font-size: .72rem;
    padding: .15rem .55rem;
    border-radius: 2px;
    letter-spacing: .08em;
    font-weight: 600;
    margin-bottom: .55rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── NAVIGATION ──────────────────────────────── */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.6rem;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .btn {
    font-family: 'Source Serif 4', serif;
    font-size: .88rem;
    font-weight: 600;
    padding: .65rem 1.5rem;
    border-radius: 2px;
    border: none;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
    letter-spacing: .04em;
  }
  .btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-prev { background: var(--paper2); color: var(--ink); border: 1px solid var(--border); }
  .btn-next { background: var(--blue-dark); color: var(--paper); }
  .btn-finish { background: var(--gold); color: var(--ink); }

  /* ── QUESTION MAP ────────────────────────────── */
  .q-map {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin-bottom: 2rem;
    justify-content: center;
  }
  .q-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--paper2);
    font-size: .78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .18s;
    color: var(--neutral);
  }
  .q-dot:hover { border-color: var(--gold); color: var(--gold); }
  .q-dot.answered-ok  { background: var(--correct); color: #fff; border-color: var(--correct); }
  .q-dot.answered-err { background: var(--wrong);   color: #fff; border-color: var(--wrong); }
  .q-dot.current { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }

  /* ── RESULT SCREEN ───────────────────────────── */
  #result-screen {
    display: none;
    text-align: center;
    animation: slideIn .5s ease;
  }
  .result-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--gold) 0%, var(--gold) var(--pct), var(--paper2) var(--pct));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 4px 24px var(--shadow);
  }
  .result-inner {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .result-score-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--blue-dark);
    line-height: 1;
  }
  .result-score-label { font-size: .72rem; color: var(--neutral); }
  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    font-weight: 900;
    color: var(--blue-dark);
    margin-bottom: .5rem;
  }
  .result-msg { font-size: .97rem; color: var(--neutral); margin-bottom: 2rem; font-style: italic; }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .stat-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1rem;
  }
  .stat-box strong { display: block; font-size: 1.6rem; font-family: 'Playfair Display', serif; color: var(--blue-dark); }
  .stat-box span { font-size: .78rem; color: var(--neutral); }
  .btn-restart { background: var(--blue-dark); color: var(--paper); font-size: 1rem; padding: .85rem 2.2rem; }
  .review-list { text-align: left; margin-top: 2rem; }
  .review-item {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 4px solid var(--border);
    padding: .9rem 1.1rem;
    margin-bottom: .7rem;
    border-radius: 0 2px 2px 0;
    font-size: .88rem;
    line-height: 1.6;
  }
  .review-item.ok   { border-left-color: var(--correct); }
  .review-item.err  { border-left-color: var(--wrong); }
  .review-q { font-weight: 600; margin-bottom: .25rem; }
  .review-detail { font-size: .82rem; color: var(--neutral); }

  /* ── RESPONSIVE ──────────────────────────────── */
  @media (max-width: 600px) {
    main { padding: 1.5rem 1rem 3rem; }
    .question-card { padding: 1.4rem 1.2rem 1.4rem; }
    .progress-wrap { padding: .65rem 1rem; }
  }
</style>
</head>
<body>

<header>
    <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
  <div class="header-badge">Simulado Inédito · 2025</div>
  <h1>História do Brasil<br>Banca VUNESP · Nível Fundamental</h1>
  <p>20 questões comentadas · Da Era Vargas ao Brasil Contemporâneo</p>
</header>

<div class="progress-wrap">
  <div class="progress-label" id="prog-label">Questão 1 de 20</div>
  <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
  <div class="score-badge" id="score-badge">Acertos: 0</div>
</div>

<main>

  <!-- QUESTION MAP -->
  <div class="q-map" id="q-map"></div>

  <!-- QUESTIONS RENDERED BY JS -->
  <div id="questions-wrap"></div>

  <!-- RESULT SCREEN -->
  <div id="result-screen">
    <div class="result-ring" id="result-ring">
      <div class="result-inner">
        <span class="result-score-num" id="result-pct">0%</span>
        <span class="result-score-label">aproveitamento</span>
      </div>
    </div>
    <div class="result-title" id="result-title">Resultado Final</div>
    <p class="result-msg" id="result-msg"></p>
    <div class="result-grid">
      <div class="stat-box"><strong id="r-acertos">0</strong><span>Acertos</span></div>
      <div class="stat-box"><strong id="r-erros">0</strong><span>Erros</span></div>
      <div class="stat-box"><strong id="r-total">20</strong><span>Total</span></div>
    </div>
    <button class="btn btn-restart" onclick="restart()">↺ Refazer Simulado</button>
    <div class="review-list" id="review-list"></div>
  </div>

</main>

<script>
// ─────────────────────────────────────────────────────────────
// QUESTIONS DATA
// ─────────────────────────────────────────────────────────────
const questions = [
{
  tag: "República Velha · 1930",
  stimulus: `"A crise do café abriu uma ferida na estrutura da República Velha. A aliança secular entre as oligarquias de São Paulo e Minas Gerais começou a rachar quando o presidente Washington Luís rompeu o acordo não escrito da política 'café com leite'."`,
  cite: "(Adaptado de material didático de História do Brasil)",
  enunciado: "Sobre a Revolução de 1930, que pôs fim à República Velha e conduziu Getúlio Vargas ao poder, é correto afirmar que",
  options: [
    "foi uma vitória eleitoral conquistada na urna por Vargas, que derrotou Júlio Prestes com ampla margem de votos.",
    "resultou do apoio exclusivo do movimento tenentista, sem nenhuma participação das oligarquias dissidentes de Minas Gerais.",
    "foi desencadeada após Washington Luís apoiar outro candidato paulista, rompendo o acordo com Minas Gerais, que então se aliou ao Rio Grande do Sul para lançar Vargas pela Aliança Liberal.",
    "teve como principal causa a recusa de Vargas em aceitar a intervenção militar estrangeira no comércio cafeeiro brasileiro.",
    "resultou diretamente da promulgação de uma nova Constituição pelos militares, que extinguiu a República e instaurou o Estado Novo."
  ],
  correct: 2,
  gabarito: "C",
  commentary: `A Revolução de 1930 não foi uma vitória eleitoral — Vargas perdeu as eleições para Júlio Prestes. O golpe ocorreu porque Washington Luís indicou outro paulista para a presidência (Júlio Prestes), rompendo a alternância com Minas Gerais prevista na política "café com leite". Minas Gerais aliou-se ao Rio Grande do Sul e lançou Vargas pela Aliança Liberal. Com o apoio de militares descontentes, o golpe de outubro de 1930 levou Vargas ao poder. O Estado Novo só viria em 1937, sete anos depois.`
},
{
  tag: "Revolução Constitucionalista · 1932",
  stimulus: `"São Paulo foi derrotado militarmente, mas, ao contrário do que se poderia esperar, saiu politicamente vitorioso do conflito. A pressão armada surtiu efeito na mesa de negociações."`,
  cite: "(Adaptado de material didático de História do Brasil)",
  enunciado: "A Revolução Constitucionalista de 1932 foi o movimento no qual o estado de São Paulo lutou com armas contra o governo provisório de Getúlio Vargas. Sobre esse episódio, é correto afirmar que",
  options: [
    "São Paulo venceu militarmente e forçou Vargas a renunciar à presidência provisória.",
    "o movimento durou cerca de três meses e, apesar da derrota militar, São Paulo obteve a convocação de uma Assembleia Constituinte.",
    "a principal reivindicação paulista era a revisão da política cafeeira e a redução do imposto de exportação sobre o café.",
    "o governo federal esmagou o movimento sem qualquer concessão política, mantendo indefinidamente o regime provisório.",
    "o conflito se estendeu por mais de dois anos, envolvendo tropas de vários estados brasileiros contra São Paulo."
  ],
  correct: 1,
  gabarito: "B",
  commentary: `A Revolução Constitucionalista de 1932 durou cerca de 3 meses (julho a outubro de 1932). Os paulistas exigiam: fim do governo provisório, convocação de uma Assembleia Constituinte e indicação de um governador civil para São Paulo. São Paulo foi derrotado militarmente, mas "venceu politicamente": Vargas cedeu às exigências e convocou a Constituinte em 1933, que promulgou a Constituição de 1934. A luta não durou dois anos, nem o objetivo era a questão cafeeira.`
},
{
  tag: "Estado Novo · Plano Cohen · 1937",
  stimulus: `"O documento foi lido na rádio nacional como prova de um iminente plano de tomada comunista do poder. O pânico se instalou. No dia seguinte, o Congresso votou o estado de guerra — e Vargas tinha o pretexto de que precisava."`,
  cite: "(Adaptado de material didático de História do Brasil)",
  enunciado: "O texto refere-se ao Plano Cohen, peça central na implantação do Estado Novo em 1937. Sobre esse episódio, é correto afirmar que",
  options: [
    "tratava-se de um documento autêntico, produzido pela Aliança Nacional Libertadora, que planejava um golpe comunista para novembro de 1937.",
    "foi elaborado pelo general Góes Monteiro e forjado pelo próprio governo de Vargas para criar um clima de medo e justificar o fechamento do Congresso.",
    "o Plano Cohen foi descoberto pelos serviços de inteligência americanos e entregue ao governo brasileiro como prova de interferência soviética.",
    "tratava-se de um manifesto da Ação Integralista Brasileira que pregava a instauração de um regime fascista no Brasil.",
    "foi criado pelo Ministério do Trabalho para justificar a cassação dos direitos políticos dos líderes sindicais contrários a Vargas."
  ],
  correct: 1,
  gabarito: "B",
  commentary: `O Plano Cohen foi um documento FORJADO (falso), atribuído ao general Góes Monteiro, que simulava um suposto plano comunista de tomada do poder. A leitura do documento na rádio nacional gerou pânico na população e no Congresso. Vargas usou o episódio como pretexto para dissolver o Congresso em 10 de novembro de 1937 e outorgar (impor) a nova Constituição autoritária — o Estado Novo. A ANL (Aliança Nacional Libertadora) havia tentado um golpe em 1935 (Intentona Comunista), mas o Plano Cohen era fabricação do próprio governo.`
},
{
  tag: "Estado Novo · Constituição de 1937",
  stimulus: `"A Constituição que Vargas outorgou ficou conhecida pelo apelido de 'Polaca', porque tinha inspiração no texto constitucional polonês de 1935, de caráter notoriamente autoritário."`,
  cite: "(Adaptado de material didático de História do Brasil)",
  enunciado: "Sobre a Constituição de 1937, outorgada por Vargas para fundamentar juridicamente o Estado Novo, é correto afirmar que ela",
  options: [
    "garantiu o direito de greve para os trabalhadores e ampliou a autonomia dos sindicatos.",
    "estabeleceu eleições diretas para governadores de estado e manteve o Poder Legislativo em funcionamento.",
    "suspendeu as liberdades individuais, impôs censura aos meios de comunicação e extinguiu todos os partidos políticos.",
    "limitou a atuação do Estado como agente econômico, proibindo a criação de novas empresas estatais.",
    "reforçou as atribuições do Poder Legislativo e garantiu plena liberdade de expressão à imprensa."
  ],
  correct: 2,
  gabarito: "C",
  commentary: `A Constituição de 1937 era um texto autoritário. Ela: SUSPENDEU as liberdades individuais; IMPÔS censura (controlada pelo DIP); EXTINGUIU todos os partidos políticos; SUSPENDEU o habeas corpus para crimes políticos; CONCENTROU poderes no Executivo (Vargas governava por decretos-lei); CANCELOU as eleições previstas para 1938. Ela NÃO garantiu direito de greve (ao contrário, controlou sindicatos), NÃO manteve o Legislativo (dissolveu o Congresso), NÃO limitou o Estado econômico (expandiu estatais, como a CSN em 1941).`
},
{

// ─────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────
let current = 0;
let answers = new Array(questions.length).fill(null); // null | {chosen, correct}
let score = 0;

// ─────────────────────────────────────────────────────────────
// BUILD UI
// ─────────────────────────────────────────────────────────────
function build() {
  const wrap = document.getElementById('questions-wrap');
  const map  = document.getElementById('q-map');
  wrap.innerHTML = '';
  map.innerHTML  = '';

  questions.forEach((q, qi) => {
    // MAP DOT
    const dot = document.createElement('button');
    dot.className = 'q-dot' + (qi === 0 ? ' current' : '');
    dot.textContent = qi + 1;
    dot.title = `Questão ${qi + 1}`;
    dot.onclick = () => goTo(qi);
    dot.id = `dot-${qi}`;
    map.appendChild(dot);

    // CARD
    const card = document.createElement('div');
    card.className = 'question-card' + (qi === 0 ? ' active' : '');
    card.id = `card-${qi}`;

    const opts = q.options.map((opt, oi) => `
      <li>
        <button class="alt-btn" id="opt-${qi}-${oi}" onclick="choose(${qi},${oi})">
          <span class="alt-letter">${'ABCDE'[oi]}</span>
          <span>${opt}</span>
        </button>
      </li>`).join('');

    card.innerHTML = `
      <div class="q-number">Questão ${qi + 1} de ${questions.length}</div>
      <span class="q-tag">${q.tag}</span>
      <div class="q-stimulus">${q.stimulus}<cite>${q.cite}</cite></div>
      <div class="q-enunciado">${q.enunciado}</div>
      <ul class="alternatives">${opts}</ul>
      <div class="feedback" id="fb-${qi}">
        <div class="gabarito-tag">Gabarito: Alternativa ${q.gabarito}</div>
        <div class="feedback-title" id="fb-title-${qi}"></div>
        <div id="fb-text-${qi}">${q.commentary}</div>
      </div>
      <div class="nav-row">
        <button class="btn btn-prev" onclick="prev()" ${qi===0?'disabled':''}>← Anterior</button>
        ${qi < questions.length-1
          ? `<button class="btn btn-next" id="btn-next-${qi}" onclick="next()">Próxima →</button>`
          : `<button class="btn btn-finish" id="btn-next-${qi}" onclick="finish()">Ver Resultado ✓</button>`
        }
      </div>`;
    wrap.appendChild(card);
  });

  updateProgress();
}

// ─────────────────────────────────────────────────────────────
// CHOOSE ANSWER
// ─────────────────────────────────────────────────────────────
function choose(qi, oi) {
  if (answers[qi] !== null) return; // already answered

  const q = questions[qi];
  const isCorrect = oi === q.correct;

  if (isCorrect) score++;
  answers[qi] = { chosen: oi, correct: q.correct };

  // style buttons
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === oi && !isCorrect) btn.classList.add('wrong');
  }

  // feedback
  const fb = document.getElementById(`fb-${qi}`);
  const fbTitle = document.getElementById(`fb-title-${qi}`);
  fb.classList.add('show');
  if (isCorrect) {
    fb.classList.add('correct-fb');
    fbTitle.textContent = '✓ Resposta correta!';
  } else {
    fb.classList.add('wrong-fb');
    fbTitle.textContent = `✗ Resposta incorreta. A alternativa correta é a ${q.gabarito}.`;
  }

  // dot
  const dot = document.getElementById(`dot-${qi}`);
  dot.classList.remove('current');
  dot.classList.add(isCorrect ? 'answered-ok' : 'answered-err');

  updateProgress();
}

// ─────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────
function goTo(qi) {
  document.getElementById(`card-${current}`).classList.remove('active');
  document.getElementById(`dot-${current}`).classList.remove('current');
  current = qi;
  document.getElementById(`card-${current}`).classList.add('active');
  if (!answers[qi]) document.getElementById(`dot-${qi}`).classList.add('current');
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}
function next() { if (current < questions.length-1) goTo(current+1); }
function prev() { if (current > 0) goTo(current-1); }

// ─────────────────────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────────────────────
function updateProgress() {
  const answered = answers.filter(a=>a!==null).length;
  const pct = Math.round((answered/questions.length)*100);
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `Questão ${current+1} de ${questions.length}`;
  document.getElementById('score-badge').textContent = `Acertos: ${score}`;
}

// ─────────────────────────────────────────────────────────────
// FINISH
// ─────────────────────────────────────────────────────────────
function finish() {
  const unanswered = answers.filter(a=>a===null).length;
  if (unanswered > 0) {
    const ok = confirm(`Você ainda tem ${unanswered} questão(ões) sem resposta. Deseja finalizar mesmo assim?`);
    if (!ok) return;
  }
  document.getElementById('questions-wrap').style.display = 'none';
  document.getElementById('q-map').style.display = 'none';

  const pct = Math.round((score/questions.length)*100);
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';

  document.getElementById('result-ring').style.setProperty('--pct', pct+'%');
  document.getElementById('result-pct').textContent = pct+'%';
  document.getElementById('r-acertos').textContent = score;
  document.getElementById('r-erros').textContent = questions.length - score;

  let title, msg;
  if (pct >= 90) { title = 'Excelente! 🏆'; msg = 'Domínio excepcional do conteúdo. Você está pronto para a prova!'; }
  else if (pct >= 70) { title = 'Muito bem! 🎯'; msg = 'Bom desempenho. Revise os pontos em que errou e você estará preparado.'; }
  else if (pct >= 50) { title = 'Em desenvolvimento 📚'; msg = 'Você está no caminho certo. Releia a apostila e refaça o simulado.'; }
  else { title = 'Continue estudando 💪'; msg = 'Revise todo o conteúdo do plano de 4 dias e tente novamente.'; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent = msg;

  const rl = document.getElementById('review-list');
  rl.innerHTML = '<h3 style="margin-bottom:1rem;font-family:Playfair Display,serif;font-size:1.1rem;color:var(--blue-dark);">Revisão das questões</h3>';
  questions.forEach((q, qi) => {
    const a = answers[qi];
    const ok = a && a.chosen === a.correct;
    const div = document.createElement('div');
    div.className = 'review-item ' + (a===null ? '' : ok ? 'ok' : 'err');
    div.innerHTML = `<div class="review-q">Q${qi+1} · ${q.tag}</div>
      <div class="review-detail">
        ${a===null ? '⚠️ Não respondida' : ok ? '✓ Correta' : `✗ Você marcou: ${['A','B','C','D','E'][a.chosen]} · Correta: ${q.gabarito}`}
      </div>`;
    rl.appendChild(div);
  });

  window.scrollTo({top:0,behavior:'smooth'});
}

// ─────────────────────────────────────────────────────────────
// RESTART
// ─────────────────────────────────────────────────────────────
function restart() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  score = 0;
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('questions-wrap').style.display = '';
  document.getElementById('q-map').style.display = '';
  build();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
build();
</script>
</body>
