<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questões de Geografia · VUNESP · Nível Fundamental</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1a472a;
    --verde-medio: #2d6a4f;
    --verde-claro: #52b788;
    --amarelo: #d4a017;
    --amarelo-claro: #fef3c7;
    --creme: #faf7f2;
    --papel: #f5f0e8;
    --tinta: #1c1c1c;
    --tinta-suave: #3d3d3d;
    --cinza: #9ca3af;
    --errado: #c0392b;
    --errado-bg: #fdf0ef;
    --certo: #1a6b3c;
    --certo-bg: #edf7f1;
    --borda: #d6cfc2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background-color: var(--creme);
    color: var(--tinta);
    line-height: 1.7;
  }

  /* CABEÇALHO */

  /* Adicione junto ao CSS do Header */
  .btn-voltar {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    color: var(--gold-light);
    text-decoration: none;
    font-family: 'Source Serif 4', serif;
    font-size: 0.85rem;
    font-weight: 600;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .btn-voltar:hover {
    opacity: 0.7;
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    .btn-voltar {
      position: relative;
      display: inline-block;
      top: 0;
      left: 0;
      margin-bottom: 1.5rem;
    }
  }
  header {
    background: var(--verde);
    color: #fff;
    padding: 48px 32px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 18px,
      rgba(255,255,255,0.03) 18px,
      rgba(255,255,255,0.03) 36px
    );
  }
  header .badge {
    display: inline-block;
    background: var(--amarelo);
    color: var(--verde);
    font-family: 'Source Serif 4', serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 2px;
    margin-bottom: 18px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 5vw, 44px);
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  header p {
    font-size: 14px;
    opacity: 0.75;
    letter-spacing: 0.5px;
  }

  /* PLACAR */
  .placar-bar {
    background: var(--papel);
    border-bottom: 2px solid var(--borda);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .placar-info {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
  }
  .placar-item {
    text-align: center;
  }
  .placar-item .num {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--verde);
    display: block;
  }
  .placar-item .label {
    font-size: 11px;
    color: var(--cinza);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .btn-reset {
    background: transparent;
    border: 1.5px solid var(--verde);
    color: var(--verde);
    font-family: 'Source Serif 4', serif;
    font-size: 13px;
    padding: 8px 20px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .btn-reset:hover {
    background: var(--verde);
    color: #fff;
  }

  /* CONTAINER */
  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* QUESTÃO */
  .questao {
    background: #fff;
    border: 1.5px solid var(--borda);
    border-radius: 6px;
    margin-bottom: 32px;
    overflow: hidden;
    transition: box-shadow 0.3s;
  }
  .questao:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,0.07);
  }

  .questao-header {
    background: var(--verde);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .q-numero {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: rgba(255,255,255,0.3);
    line-height: 1;
    min-width: 40px;
  }
  .q-tema {
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 1.8px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .q-status-icon {
    margin-left: auto;
    font-size: 20px;
    display: none;
  }

  .questao-body {
    padding: 28px 28px 20px;
  }

  .enunciado {
    font-size: 15.5px;
    line-height: 1.75;
    color: var(--tinta);
    margin-bottom: 6px;
  }
  .enunciado strong {
    color: var(--verde-medio);
  }

  .destaque-box {
    background: var(--amarelo-claro);
    border-left: 4px solid var(--amarelo);
    padding: 12px 18px;
    margin: 14px 0 20px;
    font-size: 14px;
    border-radius: 0 4px 4px 0;
    font-style: italic;
    color: #5a4a00;
  }

  .tabela-questao {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin: 14px 0 20px;
    border: 1px solid var(--borda);
    border-radius: 4px;
    overflow: hidden;
  }
  .tabela-questao thead tr {
    background: var(--verde-medio);
    color: #fff;
  }
  .tabela-questao th, .tabela-questao td {
    padding: 9px 14px;
    text-align: left;
    border-bottom: 1px solid var(--borda);
  }
  .tabela-questao tbody tr:nth-child(even) {
    background: var(--papel);
  }

  /* ALTERNATIVAS */
  .alternativas {
    list-style: none;
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .alt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--borda);
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .alt:hover {
    border-color: var(--verde-claro);
    background: var(--certo-bg);
  }
  .alt.selecionada {
    border-color: #2563eb;
    background: #eff6ff;
  }
  .alt.correta {
    border-color: var(--certo);
    background: var(--certo-bg);
  }
  .alt.errada {
    border-color: var(--errado);
    background: var(--errado-bg);
  }
  .alt.neutra-certa {
    border-color: var(--certo);
    background: var(--certo-bg);
    opacity: 0.7;
  }
  .alt-letra {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    min-width: 24px;
    color: var(--verde-medio);
    padding-top: 1px;
  }
  .alt.errada .alt-letra { color: var(--errado); }
  .alt.correta .alt-letra, .alt.neutra-certa .alt-letra { color: var(--certo); }
  .alt-texto {
    font-size: 14.5px;
    line-height: 1.55;
  }

  /* GABARITO */
  .gabarito-section {
    display: none;
    margin: 18px 28px 28px;
    border-radius: 6px;
    overflow: hidden;
    border: 1.5px solid var(--borda);
  }
  .gabarito-header {
    background: var(--verde-medio);
    color: #fff;
    padding: 10px 18px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .gabarito-body {
    background: var(--papel);
    padding: 18px 20px;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--tinta-suave);
  }
  .gabarito-body .resposta-certa {
    color: var(--certo);
    font-weight: 600;
    font-size: 15px;
    display: block;
    margin-bottom: 10px;
  }
  .gabarito-body .dica-pegadinha {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 4px;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 13.5px;
    color: #5a4000;
  }
  .gabarito-body .dica-pegadinha::before {
    content: '⚠️ Pegadinha: ';
    font-weight: 700;
  }
  .gabarito-body .macete {
    background: #e8f5e9;
    border: 1px solid #81c784;
    border-radius: 4px;
    padding: 10px 14px;
    margin-top: 10px;
    font-size: 13.5px;
    color: #1b5e20;
  }
  .gabarito-body .macete::before {
    content: '🧠 Macete: ';
    font-weight: 700;
  }

  /* RESULTADO FINAL */
  .resultado-final {
    display: none;
    background: var(--verde);
    color: #fff;
    border-radius: 8px;
    padding: 40px;
    text-align: center;
    margin-top: 20px;
  }
  .resultado-final h2 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    margin-bottom: 12px;
  }
  .resultado-final .nota {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    font-weight: 900;
    color: var(--amarelo);
    display: block;
    line-height: 1;
    margin: 16px 0;
  }
  .resultado-final p { opacity: 0.85; font-size: 15px; }

  /* PROGRESS */
  .progress-wrap {
    background: var(--borda);
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    width: 140px;
  }
  .progress-bar {
    height: 100%;
    background: var(--verde-claro);
    transition: width 0.4s ease;
    border-radius: 2px;
  }

  @media (max-width: 600px) {
    .questao-body { padding: 20px 16px 14px; }
    .gabarito-section { margin: 12px 16px 20px; }
    .placar-bar { padding: 12px 16px; }
  }
</style>
</head>
<body>

<header>
    <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
  <div class="badge">Banca VUNESP · Nível Fundamental · 2026</div>
  <h1>Bateria de Questões<br>Geografia do Brasil</h1>
  <p>20 questões inéditas · Gabarito comentado · Padrão VUNESP</p>
</header>

<div class="placar-bar">
  <div class="placar-info">
    <div class="placar-item">
      <span class="num" id="cnt-respondidas">0</span>
      <span class="label">Respondidas</span>
    </div>
    <div class="placar-item">
      <span class="num" id="cnt-certas" style="color:var(--certo)">0</span>
      <span class="label">Acertos</span>
    </div>
    <div class="placar-item">
      <span class="num" id="cnt-erradas" style="color:var(--errado)">0</span>
      <span class="label">Erros</span>
    </div>
    <div class="placar-item">
      <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      <span class="label" id="progress-label">0 / 20</span>
    </div>
  </div>
  <button class="btn-reset" onclick="resetar()">↺ Reiniciar</button>
</div>

<div class="container" id="questoes-container">
<!-- JS vai injetar as questões aqui -->
</div>

<script>
const questoes = [
  {
    numero: 1,
    tema: "Domínios Morfoclimáticos",
    enunciado: `Observe as características a seguir e identifique o domínio morfoclimático brasileiro correspondente: vegetação de árvores retorcidas com cascas grossas, raízes profundas, gramíneas e solo avermelhado; clima tropical continental com inverno seco e verão úmido; presença marcante de soja, milho e algodão.`,
    destaque: null,
    tabela: null,
    alternativas: [
      "Amazônico",
      "Cerrado",
      "Caatinga",
      "Mares de Morros",
      "Pradarias"
    ],
    gabarito: 1,
    explicacao: `O Cerrado é o "segundo maior bioma do Brasil" e ocupa o Planalto Central (GO, MT, MS, TO, oeste de MG e BA). Suas características visuais mais marcantes são as árvores baixas e retorcidas com cascas grossas — adaptadas ao fogo e ao estresse hídrico do inverno seco. O solo laterítico avermelhado e a presença de gramíneas completam o reconhecimento. O domínio do Cerrado tornou-se o coração do agronegócio brasileiro: em 2017, respondia por 60% da produção nacional de soja.`,
    pegadinha: `A Caatinga também tem inverno seco, mas é identificada pelos cactos e solo pedregoso/rachado, não por árvores retorcidas com gramíneas.`,
    macete: `Árvores retorcidas + capim + solo vermelho + soja = CERRADO.`
  },
  {
    numero: 2,
    tema: "Localização e Extensão",
    enunciado: `O Brasil é o quinto maior país do mundo em área territorial. Com relação à sua localização geográfica, é correto afirmar que`,
    destaque: null,
    tabela: null,
    alternativas: [
      "o país faz fronteira com todos os países da América do Sul, sem exceção.",
      "o Trópico de Capricórnio atravessa apenas o estado de São Paulo.",
      "a Linha do Equador corta o território brasileiro no estado do Amapá.",
      "o Brasil está localizado integralmente no hemisfério sul.",
      "o ponto mais ao norte do território fica no estado do Amazonas."
    ],
    gabarito: 2,
    explicacao: `A Linha do Equador (0°) atravessa o território brasileiro na altura do estado do Amapá, ao norte do país. Isso explica o clima equatorial quente e úmido da Amazônia próxima a essa região. O ponto mais ao norte é a Serra do Tumucumaque, no Amapá, a 5°16'N.`,
    pegadinha: `O Brasil NÃO faz fronteira com Equador e Chile. O Trópico de Capricórnio passa por SP, PR e MS (não só SP). O Brasil não está integralmente no hemisfério sul — 7% do território fica no hemisfério norte.`,
    macete: `Linha do Equador = Amapá. Trópico de Capricórnio = SP + PR + MS.`
  },
  {
    numero: 3,
    tema: "Domínios Morfoclimáticos",
    enunciado: `Um estudante descreveu uma paisagem que observou em viagem ao Sul do Brasil: "Vi pinheiros com copa em formato de guarda-chuva aberta, planaltos elevados e clima muito frio com geadas frequentes no inverno." Qual domínio morfoclimático foi descrito pelo estudante?`,
    destaque: null,
    tabela: null,
    alternativas: [
      "Pradarias (Campanha Gaúcha)",
      "Mares de Morros",
      "Domínio das Araucárias",
      "Cerrado",
      "Amazônico"
    ],
    gabarito: 2,
    explicacao: `O Domínio das Araucárias, também chamado de Florestas de Araucárias, ocupa o Planalto Meridional (RS, SC e PR). Sua vegetação característica é o Pinheiro-do-Paraná (Araucaria angustifolia), com copa plana em "guarda-chuva" — traço visual inconfundível nas questões com fotografia. O clima subtropical com invernos frios e geadas é outro identificador preciso.`,
    pegadinha: `As Pradarias estão no extremo sul do RS (fronteira com Argentina/Uruguai) e têm campos ABERTOS, sem árvores. Não confundir com Araucárias.`,
    macete: `Pinheiro copa plana + geadas + Sul do Brasil = ARAUCÁRIAS.`
  },
  {
    numero: 4,
    tema: "Hidrografia",
    enunciado: `A usina hidrelétrica de Itaipu, uma das maiores do mundo em capacidade instalada, foi construída em parceria entre o Brasil e outro país. Sobre essa usina e a bacia hidrográfica em que está inserida, analise as afirmações: I. Itaipu está localizada no rio Paraná, em obra compartilhada entre Brasil e Paraguai. II. A Bacia do Paraná é a que apresenta maior aproveitamento hidrelétrico do Brasil. III. Itaipu é a maior hidrelétrica 100% brasileira.`,
    destaque: null,
    tabela: null,
    alternativas: [
      "Apenas I está correta.",
      "Apenas III está correta.",
      "I e II estão corretas.",
      "II e III estão corretas.",
      "I, II e III estão corretas."
    ],
    gabarito: 2,
    explicacao: `Itaipu está no rio Paraná (fronteira Brasil-Paraguai), com capacidade de 14.000 MW — o que torna I correta. A Bacia do Paraná concentra as maiores usinas do Brasil (Itaipu, Jupiá, Porto Primavera), com maior aproveitamento hidrelétrico — II correta. A afirmação III está ERRADA: a maior usina 100% brasileira é Tucuruí (PA), no rio Tocantins, com 8.370 MW.`,
    pegadinha: `Itaipu não é 100% brasileira — é compartilhada com o Paraguai. A questão usa essa distinção com frequência.`,
    macete: `Maior hidrelétrica compartilhada = Itaipu (BR + PY). Maior 100% brasileira = Tucuruí (PA).`
  },
  {
    numero: 5,
    tema: "Vegetação e Biomas",
    enunciado: `Sobre os biomas brasileiros e seus percentuais de cobertura original restante, relacione corretamente:`,
    tabela: {
      headers: ["Bioma", "Percentual restante (aprox.)"],
      rows: [
        ["Floresta Amazônica", "~80% (desmatamento acumulado ~20%)"],
        ["Cerrado", "~50%"],
        ["Mata Atlântica", "12–16%"],
        ["Pampa (RS)", "~36%"]
      ]
    },
    enunciado2: `Com base nos dados acima, assinale a alternativa CORRETA:`,
    alternativas: [
      "A Mata Atlântica é o bioma mais preservado do Brasil, com mais de 80% de cobertura original.",
      "O Cerrado apresenta o menor percentual de cobertura original restante entre todos os biomas.",
      "A Mata Atlântica é o bioma mais devastado do Brasil, restando apenas 12 a 16% de sua cobertura.",
      "A Floresta Amazônica perdeu mais de 50% de sua cobertura original para o desmatamento.",
      "O Pampa gaúcho está mais preservado que a Floresta Amazônica em termos percentuais."
    ],
    gabarito: 2,
    explicacao: `A Mata Atlântica é o bioma mais devastado do Brasil: de 1,3 milhão de km² originais, restam apenas 12–16% de cobertura, segundo o relatório SOS Mata Atlântica 2024. Isso se deve principalmente à ocupação histórica do litoral brasileiro, que coincide com as áreas mais populosas e industrializadas do país (Sudeste e Sul).`,
    pegadinha: `O Cerrado tem ~50% restante — menos que a Amazônia (~80%), mas mais que a Mata Atlântica (12–16%). Não é o mais devastado.`,
    macete: `Mais devastado = Mata Atlântica (12–16%). Mais ameaçado pelo desmatamento atual = Cerrado (supera Amazônia em km² recentes).`
  },
  {
    numero: 6,
    tema: "Recursos Naturais",
    enunciado: `O Brasil detém posição de destaque mundial em relação a um mineral estratégico utilizado na produção de aços especiais, superligas e como catalisador em refinarias de petróleo. Sobre esse mineral, é correto afirmar que`,
    destaque: "O Brasil controla 98% das reservas mundiais desse mineral.",
    alternativas: [
      "trata-se do lítio, cuja principal mina fica no estado do Pará.",
      "é o minério de ferro, exportado principalmente pela Serra dos Carajás.",
      "trata-se do nióbio, com principal produção em Araxá, Minas Gerais.",
      "é a bauxita, matéria-prima do alumínio, extraída em Trombetas (PA).",
      "trata-se do manganês, encontrado na Serra do Navio, no Amapá."
    ],
    gabarito: 2,
    explicacao: `O Brasil detém 98% das reservas mundiais de nióbio, mineral estratégico para a produção de aços especiais e ligas metálicas. A principal produtora é a CBMM (Companhia Brasileira de Metalurgia e Mineração), localizada em Araxá, Minas Gerais. Esse dado é muito cobrado pela VUNESP por ser um "número marcante" fácil de formular em questão.`,
    pegadinha: `Lítio (carros elétricos) fica no Vale do Jequitinhonha (MG), não no PA. Minério de ferro = Serra dos Carajás, mas o Brasil é o 2º exportador, não detentor de 98% das reservas.`,
    macete: `98% das reservas mundiais = NIÓBIO. CBMM = Araxá (MG).`
  },
  {
    numero: 7,
    tema: "Problemas Ambientais",
    enunciado: `Em 25 de janeiro de 2019, o rompimento de uma barragem de rejeitos de mineração causou a maior tragédia ambiental da história do Brasil, vitimando 272 pessoas e devastando o rio Paraopeba. Esse evento ocorreu em`,
    destaque: null,
    tabela: null,
    alternativas: [
      "Mariana (MG), em 2019.",
      "Brumadinho (MG), em 2019.",
      "Congonhas (MG), em 2015.",
      "Ouro Preto (MG), em 2018.",
      "Barra Longa (MG), em 2015."
    ],
    gabarito: 1,
    explicacao: `O rompimento da Barragem B1 da Vale, em Brumadinho (MG), em 25 de janeiro de 2019, matou 272 pessoas e lançou mais de 12 milhões de m³ de lama no rio Paraopeba. É considerado o maior desastre ambiental do Brasil em número de vítimas. O desastre de Mariana (2015), no rio Doce, foi o maior em volume de rejeitos.`,
    pegadinha: `Mariana = 2015 (rio Doce). Brumadinho = 2019 (rio Paraopeba). A banca pode trocar datas e rios — atenção a ambos.`,
    macete: `Brumadinho = 2019 = 272 mortos = Paraopeba. Mariana = 2015 = maior volume = rio Doce.`
  },
  {
    numero: 8,
    tema: "População Brasileira",
    enunciado: `Segundo o Censo IBGE 2022, a taxa de fecundidade total (TFT) das mulheres brasileiras ficou em 1,65 filhos por mulher, abaixo do chamado "nível de reposição". Com base nesse dado e nas tendências demográficas do Brasil, é correto afirmar que`,
    destaque: null,
    tabela: null,

let acertos = 0;
let erros = 0;
let respondidas = new Set();

function renderizar() {
  const container = document.getElementById('questoes-container');
  container.innerHTML = '';
  questoes.forEach((q, idx) => {
    const div = document.createElement('div');
    div.className = 'questao';
    div.id = `q${idx}`;

    let tabelaHTML = '';
    if (q.tabela) {
      tabelaHTML = `<table class="tabela-questao">
        <thead><tr>${q.tabela.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${q.tabela.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
    }
    let destaqueHTML = q.destaque ? `<div class="destaque-box">${q.destaque}</div>` : '';
    let enunciado2HTML = q.enunciado2 ? `<p class="enunciado" style="margin-top:12px"><strong>${q.enunciado2}</strong></p>` : '';

    const altsHTML = q.alternativas.map((a, i) => {
      const letra = String.fromCharCode(65+i);
      return `<li class="alt" id="alt-${idx}-${i}" onclick="responder(${idx}, ${i})">
        <span class="alt-letra">${letra}</span>
        <span class="alt-texto">${a}</span>
      </li>`;
    }).join('');

    div.innerHTML = `
      <div class="questao-header">
        <span class="q-numero">${String(q.numero).padStart(2,'0')}</span>
        <span class="q-tema">${q.tema}</span>
        <span class="q-status-icon" id="icon-${idx}"></span>
      </div>
      <div class="questao-body">
        <p class="enunciado">${q.enunciado}</p>
        ${destaqueHTML}
        ${tabelaHTML}
        ${enunciado2HTML}
        <ul class="alternativas">${altsHTML}</ul>
      </div>
      <div class="gabarito-section" id="gab-${idx}">
        <div class="gabarito-header">📋 Gabarito Comentado</div>
        <div class="gabarito-body">
          <span class="resposta-certa">✔ Gabarito: Alternativa ${String.fromCharCode(65+q.gabarito)}</span>
          <p>${q.explicacao}</p>
          ${q.pegadinha ? `<div class="dica-pegadinha">${q.pegadinha}</div>` : ''}
          ${q.macete ? `<div class="macete">${q.macete}</div>` : ''}
        </div>
      </div>`;
    container.appendChild(div);
  });
}

function responder(qIdx, altIdx) {
  if (respondidas.has(qIdx)) return;
  respondidas.add(qIdx);

  const q = questoes[qIdx];
  const correto = altIdx === q.gabarito;

  // Colorir alternativas
  for (let i = 0; i < q.alternativas.length; i++) {
    const el = document.getElementById(`alt-${qIdx}-${i}`);
    el.style.pointerEvents = 'none';
    if (i === q.gabarito) {
      el.className = 'alt neutra-certa';
    }
    if (i === altIdx && !correto) {
      el.className = 'alt errada';
    }
    if (i === altIdx && correto) {
      el.className = 'alt correta';
    }
  }

  // Mostrar gabarito
  document.getElementById(`gab-${qIdx}`).style.display = 'block';

  // Ícone
  const icon = document.getElementById(`icon-${qIdx}`);
  icon.style.display = 'block';
  icon.textContent = correto ? '✓' : '✗';
  icon.style.color = correto ? '#52b788' : '#ff6b6b';

  // Placar
  if (correto) acertos++; else erros++;
  atualizarPlacar();

  if (respondidas.size === questoes.length) {
    setTimeout(mostrarResultado, 600);
  }
}

function atualizarPlacar() {
  document.getElementById('cnt-respondidas').textContent = respondidas.size;
  document.getElementById('cnt-certas').textContent = acertos;
  document.getElementById('cnt-erradas').textContent = erros;
  const pct = (respondidas.size / questoes.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${respondidas.size} / ${questoes.length}`;
}

function mostrarResultado() {
  const nota = Math.round((acertos / questoes.length) * 100);
  let msg = '';
  if (nota >= 80) msg = 'Excelente! Você está bem preparado para a prova. 🏆';
  else if (nota >= 60) msg = 'Bom resultado! Revise os temas onde errou. 📚';
  else msg = 'Continue estudando! Releia os gabaritos comentados. 💪';

  let el = document.getElementById('resultado-final');
  if (!el) {
    el = document.createElement('div');
    el.id = 'resultado-final';
    el.className = 'resultado-final';
    document.getElementById('questoes-container').appendChild(el);
  }
  el.style.display = 'block';
  el.innerHTML = `<h2>Resultado Final</h2>
    <span class="nota">${nota}%</span>
    <p>${acertos} acertos de ${questoes.length} questões</p>
    <p style="margin-top:12px">${msg}</p>`;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetar() {
  acertos = 0;
  erros = 0;
  respondidas = new Set();
  atualizarPlacar();
  const res = document.getElementById('resultado-final');
  if (res) res.remove();
  renderizar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderizar();
</script>
</body>
</html>
